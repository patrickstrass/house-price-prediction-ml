apiVersion: 1

datasources:
  - name: House Price Observability Azure
    uid: house-price-postgres
    type: postgres
    access: proxy
    url: $__env{HOUSE_PRICE_DB_HOST}:5432
    user: grafana_reader
    secureJsonData:
      password: $__env{HOUSE_PRICE_GRAFANA_PASSWORD}
    jsonData:
      database: house_price
      sslmode: verify-full
      tlsConfigurationMethod: file-path
      sslRootCertFile: /etc/grafana/certs/azure-postgres-root.crt
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
